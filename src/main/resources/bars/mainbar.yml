# ==========================================================================================
#  Bar principal - reprise a l'identique des fioles de GambleBarPro
# ==========================================================================================
#  IMPORTANT : les champs "name" et "lore" sont ce qui permet de reconnaitre les anciennes
#  fioles GambleBarPro deja possedees par les joueurs (voir "legacy-compatibility" dans
#  config.yml). Les modifier rendra les anciennes fioles inutilisables.
#
#  Chaque fichier .yml de ce dossier est un bar. Le nom du fichier (sans .yml) est
#  l'identifiant du bar, utilise par /bar <barId> et /bar give <joueur> <barId> <fioleId>.
#
#  Options d'un bar :
#    title              Titre de l'inventaire
#    size               Taille (multiple de 9, de 9 a 54)
#    permission         Permission requise pour ouvrir ce bar (vide = libre)
#    default-currency   VAULT (monnaie du serveur) ou EXP (points d'XP bruts)
#    default-animation  NONE, TITLE ou ROULETTE (par defaut : animation.default-type)
#
#  Options d'une decoration (items sans effet, sous "decoration") :
#    material           Materiau (nom Bukkit, ex : BLACK_STAINED_GLASS_PANE)
#    name / lore        Nom et description
#    custom-model-data  Modele personnalise (texture pack)
#    slots              Liste des emplacements, ex : [0, 2, 4] (ou "slot" pour un seul)
#
#  Options d'une fiole :
#    slot               Emplacement dans l'inventaire (obligatoire)
#    name / lore        Nom et description
#    material           Materiau (POTION par defaut, nom Bukkit)
#    custom-model-data  Modele personnalise (texture pack)
#    potion-color       RED BLUE AQUA BLACK FUCHSIA GRAY GREEN LIME MAROON NAVY OLIVE
#                       ORANGE PURPLE SILVER TEAL WHITE YELLOW, ou un code #RRGGBB
#    glow               true pour l'effet enchante
#    currency           VAULT ou EXP (par defaut : default-currency du bar)
#    price              Prix d'achat
#    reward             Gain en cas de victoire
#    odds               Probabilite de victoire, en pourcentage (ex : 48.00)
#    super-reward       Gain d'une super victoire (0 = desactive)
#    super-odds         Probabilite de super victoire, en pourcentage (0 = desactive)
#    permission         Permission requise pour acheter/boire cette fiole (vide = libre)
#    cooldown-seconds   Cooldown specifique a cette fiole (-1 = cooldown global)
#    animation          NONE (immediat), TITLE (titre anime) ou ROULETTE (GUI qui defile)
#                       (par defaut : default-animation du bar)
#    effects.win        Nom de l'effet joue en cas de victoire (par defaut : win)
#    effects.super-win  Nom de l'effet joue en cas de super victoire (defaut : super_win)
#    effects.lose       Nom de l'effet joue en cas de defaite (par defaut : lose)
#                       Ces noms renvoient a la section "effects" de config.yml : particules,
#                       sons et effets de potion s'y configurent entierement.
#    win-actions        Actions executees en cas de victoire
#    super-win-actions  Actions executees en cas de super victoire
#    lose-actions       Actions executees en cas de defaite
#
#  --- Actions disponibles -----------------------------------------------------------------
#    [message] <texte>                Message au joueur (type par defaut si aucune balise)
#    [broadcast] <texte>              Message a tout le serveur
#    [actionbar] <texte>              Barre d'action du joueur
#    [actionbar-all] <texte>          Barre d'action de tout le serveur
#    [title] <titre>;<sous-titre>;<fadeIn>;<stay>;<fadeOut>   Titre au joueur (durees en ticks)
#    [title-all] <titre>;<sous-titre>;<fadeIn>;<stay>;<fadeOut>   Titre a tout le serveur
#    [sound] <SON>;<volume>;<pitch>   Son pour le joueur
#    [sound-all] <SON>;<volume>;<pitch>   Son pour tout le serveur
#    [console] <commande>             Commande executee depuis la console
#    [player] <commande>              Commande executee au nom du joueur
#    [delay] <ticks>                  Decale toutes les actions suivantes
#
#  Sous-titre et durees d'un [title] sont optionnels (par defaut : 10;40;10).
#  Volume et pitch d'un [sound] sont optionnels (par defaut : 1.0;1.0).
#  Les sons acceptent le nom Bukkit (ENTITY_PLAYER_LEVELUP) ou la cle (entity.player.levelup).
#  Placeholders : %player% %drink% %reward% %payout% %price% %odds% %bar% %drink_id%
# ==========================================================================================

