bar-opened: ""
playtime-required: "&7&l« &c&lSH &8&l» &7Le bar est accessible après &c%required% &7de jeu. Encore &c%time%&7."
purchase: "&7&l« &e&lSH &8&l» &7Vous avez acheté la boisson %drink%"
not-enough: "&7&l« &c&lSH &8&l» &7Vous n'avez pas assez de &cSHCoins &7ou &cEXP&7."
full-inventory: "&7&l« &c&lSH &8&l» &cVotre inventaire est plein, impossible d'acheter une boisson."
transaction-failed: "&7&l« &c&lSH &8&l» &cLa transaction a echoué, réessayez."
currency-unavailable: "&7&l« &c&lSH &8&l» &cLa monnaie &f%currency% &cest indisponible, prévenez un administrateur."

