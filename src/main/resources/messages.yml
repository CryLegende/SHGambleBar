# ==========================================================================================
#  SHGambleBar - messages
# ==========================================================================================
#  Un message vide ("") n'est jamais envoye : c'est la facon de desactiver un message.
#  %prefix% est remplace par la valeur de "prefix" ci-dessous.
#  Codes couleur : &a ... &f, et couleurs hexadecimales au format &#RRGGBB.
#
#  Placeholders disponibles selon le message :
#   %player%             Pseudo du joueur concerne
#   %drink% %drink_id%   Nom affiche / identifiant de la fiole
#   %bar%                Identifiant du bar
#   %price% %reward%     Prix et gain, formates avec la monnaie (ex : 1,000 SHCoins)
#   %price_raw% %reward_raw%   Idem, sans la monnaie ni le formatage
#   %super_reward% %super_reward_raw%   Gain d'une super victoire
#   %odds% %super_odds%  Probabilites, en pourcentage
#   %currency%           VAULT ou EXP
#   %payout% %payout_raw%  Montant reellement gagne (0 en cas de defaite)
#   %balance%            Solde du joueur apres l'operation
#   %needed%             Montant manquant (message "not-enough")
#   %time% %seconds%     Temps de cooldown restant (message "cooldown")
#   %world%              Monde du joueur (message "world-blacklisted")
#   %amount%             Quantite donnee (message "gave-drink")
#
#  Placeholders de la liste "stats" :
#   %player% %drinks% %wins% %super_wins% %losses% %winrate%
#   %wagered_money% %won_money% %profit_money%
#   %wagered_exp% %won_exp% %profit_exp%
#   %biggest_win_money% %biggest_win_exp% %streak% %best_streak%
#
#  Les placeholders PlaceholderAPI (%shgamblebar_...%) sont listes dans config.yml.
# ==========================================================================================

prefix: ""

# --- Permissions et erreurs generales ---
no-permission: "&7&l« &f&lSH &8&l» &fCommande inconnue, essayer autre chose."
must-be-player: "&cCette commande doit etre executee par un joueur."
invalid-bar: "&7&l« &c&lSH &8&l» &7Veuillez utiliser la commande &c/bar&7."
player-not-found: "&cJoueur introuvable : &f%player%&c."
invalid-drink: "&cFiole introuvable (bar : &f%bar%&c, fiole : &f%drink%&c)."
usage-give: "&7&l« &c&lSH &8&l» &cUtilisation : /bar give <joueur> <barId> <fioleId> [quantite]"
usage-open: "&7&l« &c&lSH &8&l» &cUtilisation : /bar open <joueur> [barId]"
stats-unavailable: "&7&l« &c&lSH &8&l» &cLes statistiques sont desactivees."
reloaded: "&7&l« &a&lSH &8&l» &7Les fichiers de SHGambleBar ont ete recharges."

